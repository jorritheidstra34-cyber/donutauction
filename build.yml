name: Build mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Zoekt automatisch de nieuwste Fabric Loader en Fabric API voor 26.2
      - name: Fill in Fabric versions
        run: |
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
                | grep -o '<version>[^<]*+26\.2[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1)
          echo "loader=$LOADER api=$API"
          test -n "$LOADER" && test -n "$API"
          sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          sed -i "s/^fabric_version=.*/fabric_version=$API/" gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: donutauction-jar
          path: build/libs/donutauction-*.jar
          if-no-files-found: error
